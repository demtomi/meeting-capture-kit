name: CI

# Builds the package and runs every verification executable.
#
# There are no secrets and no network access in this workflow. Every check runs
# with no microphone grant, no screen-recording grant and no display, which is the
# whole reason the suite can run on a hosted runner at all. The one socket is
# transcribe-check's stub server on 127.0.0.1, and the transcriber refuses any API
# base that is not a loopback host, so no key and no audio can leave the runner.
#
# ---------------------------------------------------------------------------
# RUNNER macOS VERSION
#
# `Package.swift` declares `platforms: [.macOS("14.2")]`, which is where
# `AudioHardwareCreateProcessTap` arrives. Any `macos-latest` image in service
# clears that comfortably.
#
# A runner BELOW the floor does not fail at resolution. `platforms:` is a
# deployment target, and this package has no dependencies, so there is no
# resolution-time host check to fail — a floor set above the host still builds.
# What fails is COMPILATION, with availability errors out of
# `SystemTap.swift` and `MicCapture.swift`. So an availability error naming
# macOS 14.0 here is a runner-version problem, not a test failure; reading it as
# one wastes an afternoon. Check the runner against the floor first:
#
#   - the "Report runner macOS version" step below prints it
#   - https://github.com/actions/runner-images lists which alias points where
#
# The floor was 26.0 until it was measured. That was the development machine's
# version rather than a requirement, and it locked out every Mac more than two
# releases old. Raising it again needs the same treatment: build at the new
# floor and run all seven checks before changing the number.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The live-audio harness is 77 mutations and tens of minutes, so it runs nightly
  # rather than blocking a push. Without this trigger the scheduled step below is dead
  # code that reads like coverage.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and run checks
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Report runner macOS version
        # Printed before anything else, so a resolution failure below can be
        # matched against the floor in Package.swift without guessing.
        run: |
          sw_vers
          echo "Package.swift platforms line:"
          grep -n 'platforms' Package.swift
          swift --version

      - name: Build
        run: swift build

      - name: Run verification executables
        # Every check exits 0 on success and 1 with the failing case named.
        # `silence-gate-check` also exits 2 when its fixture is missing or empty,
        # so a run that verified nothing cannot read as a pass. Any non-zero code
        # fails the job.
        # The loop runs all seven so one failure does not hide the others.
        run: |
          set -u
          BIN="$(swift build --show-bin-path)"
          FAILED=""
          for check in \
            audio-pipeline-check \
            silence-gate-check \
            speaker-naming-check \
            screen-record-check \
            meeting-presence-check \
            live-audio-check \
            transcribe-check
          do
            echo "::group::$check"
            if "$BIN/$check"; then
              echo "PASS $check"
            else
              status=$?
              echo "FAIL $check (exit $status)"
              FAILED="$FAILED $check"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "Failed checks:$FAILED"
            exit 1
          fi
          echo "All checks passed."

      # THE MUTATION HARNESSES, which are the point of this package.
      #
      # The checks above prove the suite passes. A suite that passes is evidence about
      # nothing until a defect makes it fail, and that is exactly what these scripts
      # establish: each one breaks a source on purpose and asserts that the NAMED case
      # goes red. Leaving them out of CI meant the project's single differentiator was
      # enforced by nobody — a change that made a mutation stop biting would have merged
      # green, and CONTRIBUTING.md calls adding one a merge requirement.
      #
      # The four fast harnesses plus captureio run on every push. `live-audio` carries 77
      # mutations and takes the better part of an hour, so it runs on a schedule instead
      # of blocking a push. Splitting them that way is a deliberate trade: the long one is
      # not less important, it is less frequent.
      - name: Run mutation harnesses
        if: github.event_name != 'schedule'
        run: |
          set -u
          FAILED=""
          for s in captureio screen-record speaker-naming meeting-presence silence-gate transcribe
          do
            echo "::group::$s-mutations"
            if bash "Scripts/$s-mutations.sh"; then
              echo "PASS $s"
            else
              echo "FAIL $s"
              FAILED="$FAILED $s"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "Harnesses whose mutations stopped biting:$FAILED"
            exit 1
          fi
          echo "Every mutation bit its named case."

      # The long one. 77 mutations over LiveAudio, including the two declared <crash>
      # limbs. Scheduled rather than per-push because it is measured in tens of minutes.
      - name: Run the live-audio harness
        if: github.event_name == 'schedule'
        run: bash Scripts/live-audio-mutations.sh
